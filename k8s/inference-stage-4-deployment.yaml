apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-stage-4-deployment
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-stage-4
  template:
    metadata:
      labels:
        app: inference-stage-4
    spec:
      nodeSelector:
        kubernetes.io/hostname: pinode10
      initContainers:
        - name: fetch-stage-partition
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              FILE="stage_${STAGE_ID}.pt"
              URL="https://huggingface.co/${HF_STAGE_REPO}/resolve/${HF_STAGE_REVISION}/${FILE}"
              echo "Downloading ${URL}"
              export FILE URL HF_TOKEN
              python - <<'PY'
              import os
              import pathlib
              import time
              import urllib.request

              file_name = os.environ["FILE"]
              url = os.environ["URL"]
              token = os.environ["HF_TOKEN"]
              timeout_seconds = float(os.environ.get("HF_DOWNLOAD_TIMEOUT_SECONDS", "900"))
              output_path = pathlib.Path("/models") / file_name
              headers = {"Authorization": f"Bearer {token}"}

              last_error = None
              for attempt in range(1, 7):
                  try:
                      request = urllib.request.Request(url, headers=headers)
                      with urllib.request.urlopen(request, timeout=timeout_seconds) as response, output_path.open("wb") as handle:
                          while True:
                              chunk = response.read(1024 * 1024)
                              if not chunk:
                                  break
                              handle.write(chunk)
                      print(f"Downloaded {output_path}")
                      break
                  except Exception as exc:
                      last_error = exc
                      print(f"Attempt {attempt}/6 failed: {exc}", flush=True)
                      if attempt < 6:
                          time.sleep(3)
              else:
                  raise SystemExit(f"Download failed after 6 attempts: {last_error}")
              PY
              ls -lh "/models/${FILE}"
          env:
            - name: STAGE_ID
              value: "4"
            - name: HF_STAGE_REPO
              valueFrom:
                configMapKeyRef:
                  name: dli-config
                  key: HF_STAGE_REPO
            - name: HF_STAGE_REVISION
              valueFrom:
                configMapKeyRef:
                  name: dli-config
                  key: HF_STAGE_REVISION
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-hub
                  key: HF_TOKEN
            - name: HF_DOWNLOAD_TIMEOUT_SECONDS
              value: "900"
          volumeMounts:
            - name: stage-model
              mountPath: /models
      containers:
        - name: inference-stage-4
          image: mipeda150/distributed-layer-inference-stage:v2026-08-05-2300
          imagePullPolicy: Always
          env:
            - name: STAGE_ID
              value: "4"
            - name: NEXT_STAGE_URL
              value: ""
            - name: STAGE_MAP_PATH
              valueFrom:
                configMapKeyRef:
                  name: dli-config
                  key: STAGE_MAP_PATH
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: stage-model
              mountPath: /app/models
          resources:
            requests:
              memory: "1500Mi"
              cpu: "1000m"
            limits:
              memory: "3500Mi"
              cpu: "4000m"
      volumes:
        - name: stage-model
          emptyDir: {}
