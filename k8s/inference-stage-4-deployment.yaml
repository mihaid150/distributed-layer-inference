apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-stage-4-deployment
  namespace: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inference-stage-4
  template:
    metadata:
      labels:
        app: inference-stage-4
    spec:
      nodeSelector:
        kubernetes.io/hostname: pinode10
      initContainers:
        - name: fetch-stage-partition
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              FILES="stage_${STAGE_ID}.pt"
              if [ "${FETCH_REBALANCE_PARTITIONS:-true}" = "true" ]; then
                FILES="${FILES} latency_balanced_v1/stage_${STAGE_ID}.pt"
              fi
              export FILES HF_STAGE_REPO HF_STAGE_REVISION HF_TOKEN REBALANCE_PARTITIONS_REQUIRED
              python - <<'PY'
              import os
              import pathlib
              import time
              import urllib.request

              file_names = [item for item in os.environ["FILES"].split() if item]
              repo = os.environ["HF_STAGE_REPO"]
              revision = os.environ["HF_STAGE_REVISION"]
              token = os.environ["HF_TOKEN"]
              require_optional = os.environ.get("REBALANCE_PARTITIONS_REQUIRED", "false").lower() == "true"
              timeout_seconds = float(os.environ.get("HF_DOWNLOAD_TIMEOUT_SECONDS", "900"))
              headers = {"Authorization": f"Bearer {token}"}

              for file_name in file_names:
                  url = f"https://huggingface.co/{repo}/resolve/{revision}/{file_name}"
                  output_path = pathlib.Path("/models") / file_name
                  output_path.parent.mkdir(parents=True, exist_ok=True)
                  print(f"Downloading {url}")
                  last_error = None
                  for attempt in range(1, 7):
                      try:
                          request = urllib.request.Request(url, headers=headers)
                          with urllib.request.urlopen(request, timeout=timeout_seconds) as response, output_path.open("wb") as handle:
                              while True:
                                  chunk = response.read(1024 * 1024)
                                  if not chunk:
                                      break
                                  handle.write(chunk)
                          print(f"Downloaded {output_path}")
                          break
                      except Exception as exc:
                          last_error = exc
                          print(f"Attempt {attempt}/6 failed for {file_name}: {exc}", flush=True)
                          if attempt < 6:
                              time.sleep(3)
                  else:
                      if "/" in file_name and not require_optional:
                          print(f"Optional partition {file_name} unavailable: {last_error}", flush=True)
                          continue
                      raise SystemExit(f"Download failed after 6 attempts for {file_name}: {last_error}")
              PY
              find /models -maxdepth 2 -type f -name "stage_${STAGE_ID}.pt" -exec ls -lh {} \;
          env:
            - name: STAGE_ID
              value: "4"
            - name: HF_STAGE_REPO
              valueFrom:
                configMapKeyRef:
                  name: dli-config
                  key: HF_STAGE_REPO
            - name: HF_STAGE_REVISION
              valueFrom:
                configMapKeyRef:
                  name: dli-config
                  key: HF_STAGE_REVISION
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-hub
                  key: HF_TOKEN
            - name: HF_DOWNLOAD_TIMEOUT_SECONDS
              value: "900"
          volumeMounts:
            - name: stage-model
              mountPath: /models
      containers:
        - name: inference-stage-4
          image: mipeda150/distributed-layer-inference-stage:v2026-10-05-1200
          imagePullPolicy: Always
          env:
            - name: STAGE_ID
              value: "4"
            - name: NEXT_STAGE_URL
              value: ""
            - name: STAGE_MAP_PATH
              valueFrom:
                configMapKeyRef:
                  name: dli-config
                  key: STAGE_MAP_PATH
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: stage-model
              mountPath: /app/models
          resources:
            requests:
              memory: "1500Mi"
              cpu: "1000m"
            limits:
              memory: "3500Mi"
              cpu: "4000m"
      volumes:
        - name: stage-model
          emptyDir: {}
